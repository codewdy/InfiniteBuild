<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Mock · InfiniteBuild</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">
      { "imports": { "@infinite-build/core": "/core/index.js", "@infinite-build/mock-data": "/mock-data/index.js" } }
    </script>
    <script type="module" src="/app/browser.js"></script>
    <script type="module">
      const updates = new EventSource("/__reload");
      let revision;
      updates.onmessage = (event) => {
        if (revision !== undefined && revision !== event.data) location.reload();
        revision = event.data;
      };
    </script>
  </head>
  <body>
    <main>
      <header><div><span class="eyebrow">INFINITE BUILD / SIMULATION</span><h1>战斗观察台</h1><p>观察移动、生成与死亡，逐帧检查战斗状态。</p></div><span class="badge" id="status">Running</span></header>
      <section class="stats" aria-label="战斗概览">
        <div><span>当前帧</span><strong id="frame">0</strong></div>
        <div><span>玩家位置</span><strong id="position">0.00</strong></div>
        <div><span>场上敌人</span><strong id="enemies">0</strong></div>
        <div><span>累计死亡</span><strong id="deaths">0</strong></div>
      </section>
      <section class="panel">
        <div class="panel-title"><h2>战场</h2><span id="config"></span></div>
        <canvas id="battlefield" aria-label="战场：玩家与敌人位置，玩家视野和移动范围"></canvas>
        <div class="legend"><span><i class="player"></i>Player</span><span><i class="slime"></i>Slime</span><span><i class="goblin"></i>Goblin</span><span>绿色区域 · 移动范围</span><span>蓝色区域 · 视野</span><span class="move-event">蓝色箭头 · Move</span><span class="damage-event">红色数值 · Damage</span></div>
        <div class="controls"><button id="play" class="primary">播放</button><button id="step">下一帧</button><button id="reset">重置</button><label>播放速度 <select id="speed"><option value="1">1 帧 / 秒</option><option value="5" selected>5 帧 / 秒</option><option value="15">15 帧 / 秒</option><option value="30">30 帧 / 秒</option></select></label></div>
      </section>
      <section class="panel events-panel"><div class="panel-title"><h2>事件信号</h2><span id="event-count">当前帧无事件</span></div><div class="table-wrap"><table><thead><tr><th>事件</th><th>Unit ID</th><th>详情</th></tr></thead><tbody id="events"></tbody></table></div></section>
      <div class="details">
        <section class="panel"><div class="panel-title"><h2>当前 unit</h2><span>HP / 最大 HP · 攻击 · 防御</span></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Kind</th><th>位置</th><th>HP / 最大 HP</th><th>攻击</th><th>防御</th></tr></thead><tbody id="units"></tbody></table></div></section>
        <section class="panel"><div class="panel-title"><h2>执行日志</h2><span>最近 100 帧</span></div><pre id="logs" aria-label="逐帧 JSON 日志"></pre></section>
      </div>
    </main>
  </body>
</html>
